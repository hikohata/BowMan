<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BowMan</title>
    <!-- Social Card Meta Tags -->
    <meta property="og:title" content="BowMan">
    <meta property="og:description"
        content="A turn-based archery game where you battle against CPU or friends. Adjust angle and power to hit your target!">
    <meta property="og:image" content="bow_man_title.jpg">
    <meta property="og:url" content="https://bow.gem.my.id/">
    <meta name="twitter:card" content="summary_large_image">

    <!-- PWA Support -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="bow_man_icon_square.png">
    <meta name="theme-color" content="#333333">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- PWA Install Banner -->
    <div id="pwa-install-banner" class="hidden">
        <div class="pwa-content">
            <img src="bow_man_icon_square.png" alt="Icon" class="pwa-icon">
            <div class="pwa-text">
                <span class="pwa-title">Install BowMan</span>
                <span class="pwa-desc">Play offline & fullscreen!</span>
            </div>
            <button id="pwa-install-btn">Install</button>
            <button id="pwa-close-btn">×</button>
        </div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Mobile Controls Area (Separate) -->
    <div id="mobile-controls">
        <center>
            <div id="touch-area-hint" style="color: gray; font-size: 10px; margin-bottom: 2px;">Drag screen to Aim/Power
                <!-- Removed CPU Display as per user request -->
            </div>
        </center>

        <div class="controls-row">
            <div id="move-controls">
                <button id="btn-left" class="control-btn" ontouchstart="mobileInput('Left', true)"
                    ontouchend="mobileInput('Left', false)">←</button>
                <button id="btn-up" class="control-btn" ontouchstart="mobileInput('Up', true)"
                    ontouchend="mobileInput('Up', false)">↑</button>
                <button id="btn-down" class="control-btn" ontouchstart="mobileInput('Down', true)"
                    ontouchend="mobileInput('Down', false)">↓</button>
                <button id="btn-right" class="control-btn" ontouchstart="mobileInput('Right', true)"
                    ontouchend="mobileInput('Right', false)">→</button>
            </div>
            <div id="action-controls">
                <button id="btn-weapon" class="control-btn" onclick="mobileInput('Weapon')">WPN</button>
                <button id="btn-fire" class="control-btn fire" onclick="mobileInput('Fire')">FIRE</button>
            </div>
        </div>

        <!-- Shop Controls (Hidden by default) -->
        <div id="shop-controls"
            style="display: none; margin-top: 10px; flex-wrap: wrap; justify-content: center; gap: 5px;">
            <button class="shop-btn" onclick="buyItem(players[shopCursor], 'FIRE')">1:Fire</button>
            <button class="shop-btn" onclick="buyItem(players[shopCursor], 'BOMB')">2:Bomb</button>
            <button class="shop-btn" onclick="buyItem(players[shopCursor], 'HEALTH')">3:HP</button>
            <button class="shop-btn" onclick="buyItem(players[shopCursor], 'TRIPLE')">4:Tri</button>
            <button class="shop-btn" onclick="buyItem(players[shopCursor], 'LASER')">5:Lsr</button>
            <button class="shop-btn" onclick="buyItem(players[shopCursor], 'TRIPLE_FIRE')">6:3Fire</button>
            <button class="shop-btn" onclick="buyItem(players[shopCursor], 'MEGA_BOMB')">7:Mega</button>
        </div>
    </div>
    <!-- Game Logic -->
    <script src="game.js"></script>
    <script src="pwa.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>

</html>
